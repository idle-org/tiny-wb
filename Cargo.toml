[package]
name = "tiny-wb"
version = "0.1.1"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"

[dependencies]
chrono = "0.4.38"
color-eyre = "0.6.3"
flexi_logger = "0.29.0"
# human-panic = "2.0.1"
log = { version = "0.4.22", features = ["release_max_level_error"] }
# log = { version = "0.4.22"}
memchr = "2.7.4"
packed_struct = "0.10.1"
ratatui = "=0.30.2"
serde = { version = "1.0.210", features = ["derive"] }
serialport = "4.5.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "0.8.19"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0

[profile.windows]
inherits = "release"
opt-level = "z"
debug = false
strip = true
lto = true
codegen-units = 1
incremental = false
panic = "abort"

[profile.windows-dev]
inherits = "dev"
opt-level = "z"
debug = 0
lto = true
codegen-units = 1
incremental = false
panic = "abort"

[build-dependencies]
winresource = "=0.1.17"
