[build]
rustflags = ["-Clink-arg=-fuse-ld=lld"]

[resolver]
incompatible-rust-versions = "fallback"

[alias]
# Registry source paths can differ from the inferred Cargo home on CI workers.
# Measured across library and application code; do not exclude production sources.
coverage = "llvm-cov --locked --all-targets --all-features --ignore-filename-regex /registry/src/ --json --summary-only --fail-under-lines 83 --output-path coverage/summary.json"
