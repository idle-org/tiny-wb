# Embedded defaults. Copy to config.toml to customize; partial overrides work.
# Frequencies here and in CSV are MHz; commands sent to tinySA use Hz.
port = ""
baudrate = 115200
start_frequency = 240
stop_frequency = 800
points = 10001
repeat = 1

[connection]
backend = "serial"
# Numeric socket address only; used by the TCP bridge/mock, not by native tinySA USB.
tcp_address = "127.0.0.1:7355"
tcp_timeout_ms = 3000

[serial]
# Timeout for each blocking serial read, not a whole-scan deadline.
timeout_ms = 3000
command_delay_ms = 20
settle_delay_ms = 200
scan_delay_ms = 2000
max_response_bytes = 65536
baudrates = [19200, 38400, 57600, 115200, 230400, 460800, 921600, 1843200, 2000000, 3000000]
preferred_ports = ["/dev/ttyACM0", "COM3", "COM5", "/dev/ttyS16"]

[scan]
# Detect Basic versus Ultra from version/info and apply the corresponding scan
# profile. `basic` or `ultra` can require (but never fake) an expected family.
device_model = "auto"
# Permit a detected ZS406 to enter Ultra mode for analyzer scans above its
# 900 MHz normal-mode ceiling, up to 5.4 GHz. This changes instrument state and
# acknowledges Ultra-mode alias/spur/LO-leakage limitations; it never enables RF output.
enable_ultra_mode = false
# Select the detected model's native scanraw bias: Basic 128, Ultra 174.
auto_zero_offset = true
# Manual fallback used only when auto_zero_offset is false. The selected value
# is sent with `zero`; the decoder must use that same value.
zero_offset = 128
frequency_step_mhz = 10
points_step = 100
min_points = 101
max_points = 1000001
max_repeat = 1000
# Match scanraw's integer-truncated span / points mapping. Use `inclusive` only
# to reproduce CSV files created by older tiny-wb releases.
frequency_axis = "firmware"
# Retain the historical preparatory text scan until hardware confirms removal.
legacy_pre_scan = true

[ui]
poll_interval_ms = 16
chart_min_dbm = -128.0
chart_max_dbm = 0.0

[ui.bindings]
# Plot navigation. Values are single characters or left/right/home.
zoom_in = ["+", "="]
zoom_out = ["-"]
pan_left = ["left", "h"]
pan_right = ["right", "l"]
reset_view = ["0", "home"]

[output]
directory = "."
filename_prefix = "scan"
include_header = false

[logging]
filter = "info"
directory = "."
